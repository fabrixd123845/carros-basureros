{% extends "base.html" %}

{% block title %}Editar Ruta{% endblock %}

{% block header %}
Editar Ruta: {{ ruta_nombre }}
{% endblock %}

{% block content %}
<div class="container my-4">
    <h2 class="text-center mb-4">Editar Ruta</h2>

    <!-- Formulario para el nombre de la ruta -->
    <div class="mb-3">
        <label for="nombreRuta" class="form-label">Nombre de la Ruta</label>
        <input type="text" class="form-control" id="nombreRuta" placeholder="Ingrese un nombre para la ruta" value="{{ ruta_nombre }}">
    </div>

    <!-- Mapa para editar la ruta -->
    <div id="map" style="height: 500px;" class="mb-3"></div>

    <!-- Botones -->
    <div class="text-end">
        <a href="{{ url_for('web_bp.rutas') }}" class="btn btn-secondary">Cancelar</a>
        <button class="btn btn-primary" onclick="guardarEdicion()">Guardar Cambios</button>
    </div>
</div>

<!-- Scripts de Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />

<style>
    .custom-alert {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1050;
        padding: 15px 20px;
        border-radius: 5px;
        font-size: 16px;
        font-weight: bold;
        display: none;
        transition: opacity 0.5s ease-in-out;
    }
    .custom-alert.success {
        background-color: #28a745;
        color: white;
    }
    .custom-alert.error {
        background-color: #dc3545;
        color: white;
    }
</style>

<div id="alertContainer" class="custom-alert"></div>

<script>
    // Coordenadas iniciales de fallback
    const LAT_DEFAULT = -17.3935;
    const LNG_DEFAULT = -66.2786;

    // Inicializar el mapa
    const map = L.map('map');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
    }).addTo(map);

    // Grupo de capas editables
    const drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    // Configurar controles de dibujo y edición
    const drawControl = new L.Control.Draw({
        edit: {
            featureGroup: drawnItems,
            remove: true // Permitir borrar elementos
        },
        draw: {
            polyline: true,
            polygon: false,
            rectangle: false,
            circle: false,
            marker: false
        }
    });
    map.addControl(drawControl);

    // Cargar la ruta desde el GeoJSON y centrarla
    const geojson = {{ geojson|tojson }};
    if (geojson && geojson.features) {
        const rutaLayer = L.geoJSON(geojson, {
            style: { color: '#ff5722', weight: 4 }
        }).eachLayer(function (layer) {
            drawnItems.addLayer(layer); // Añadir las capas existentes al grupo editable
        });

        // Ajustar el mapa para que se centre automáticamente en la ruta
        if (rutaLayer.getBounds) {
            map.fitBounds(rutaLayer.getBounds(), {
                animate: true,
                duration: 1.5
            });
        } else {
            map.setView([LAT_DEFAULT, LNG_DEFAULT], 13);
        }
    } else {
        map.setView([LAT_DEFAULT, LNG_DEFAULT], 13);
    }

    // Evento: Dibujo creado
    map.on('draw:created', function (e) {
        const layer = e.layer;
        drawnItems.addLayer(layer);
    });

    // Guardar cambios
    function guardarEdicion() {
        const nombreRuta = document.getElementById('nombreRuta').value.trim();
        if (!nombreRuta) {
            mostrarMensaje('Por favor, proporciona un nombre para la ruta.', 'error');
            return;
        }

        const updatedGeoJson = drawnItems.toGeoJSON();
        if (!updatedGeoJson.features || updatedGeoJson.features.length === 0) {
            mostrarMensaje('Por favor, asegúrate de dibujar o editar la ruta antes de guardar.', 'error');
            return;
        }

        fetch(`/web/editar_ruta/{{ ruta_id }}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre: nombreRuta, ruta: updatedGeoJson })
        })
        .then(response => response.json())
        .then(data => {
            mostrarMensaje(data.message, data.success ? 'success' : 'error');
            if (data.success) {
                setTimeout(() => window.location.href = "{{ url_for('web_bp.rutas') }}", 2000);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            mostrarMensaje('Error al guardar los cambios. Inténtalo de nuevo.', 'error');
        });
    }

    // Mostrar mensajes de alerta
    function mostrarMensaje(mensaje, tipo) {
        const alertContainer = document.getElementById('alertContainer');
        alertContainer.className = `custom-alert ${tipo}`;
        alertContainer.innerText = mensaje;
        alertContainer.style.display = 'block';
        alertContainer.style.opacity = '1';

        setTimeout(() => {
            alertContainer.style.opacity = '0';
            setTimeout(() => alertContainer.style.display = 'none', 500);
        }, 3000);
    }
</script>
{% endblock %}
