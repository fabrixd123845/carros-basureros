{% extends "base.html" %}

{% block title %}Crear Nueva Ruta{% endblock %}

{% block header %}
Crear Nueva Ruta
{% endblock %}

{% block content %}
<div class="container my-4">
    <h2 class="text-center mb-4">Crear Nueva Ruta</h2>

    <!-- Formulario para el nombre de la ruta -->
    <div class="mb-3">
        <label for="nombreRuta" class="form-label">Nombre de la Ruta</label>
        <input type="text" class="form-control" id="nombreRuta" placeholder="Ingrese un nombre para la ruta">
    </div>

    <!-- Mapa para dibujar la ruta -->
    <div id="map" style="height: 500px;" class="mb-3"></div>

    <!-- Botones -->
    <div class="text-end">
        <a href="{{ url_for('web_bp.rutas') }}" class="btn btn-secondary">Cancelar</a>
        <button class="btn btn-primary" onclick="guardarRuta()">Guardar Ruta</button>
    </div>
</div>

<!-- Contenedor para mensajes de alerta -->
<div id="alertContainer" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1050;"></div>

<!-- Scripts de Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />

<script>
    // Coordenadas de Colcapirhua, Cochabamba, Bolivia
    const LAT_COLCAPIRHUA = -17.3935;
    const LNG_COLCAPIRHUA = -66.2786;

    // Configurar el mapa de Leaflet
    const map = L.map('map').setView([LAT_COLCAPIRHUA, LNG_COLCAPIRHUA], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
    }).addTo(map);

    const drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    const drawControl = new L.Control.Draw({
        edit: {
            featureGroup: drawnItems,
            remove: true // Permitir borrar elementos dibujados
        },
        draw: {
            polyline: true, // Solo se pueden dibujar líneas
            polygon: false,
            rectangle: false,
            circle: false,
            marker: false
        }
    });
    map.addControl(drawControl);

    let rutaGeoJson = null;

    // Evento al crear una nueva capa
    map.on('draw:created', function (e) {
        drawnItems.clearLayers(); // Limpiar cualquier capa existente
        const layer = e.layer;
        drawnItems.addLayer(layer);
        rutaGeoJson = layer.toGeoJSON(); // Actualizar el GeoJSON
    });

    // Evento al borrar capas
    map.on('draw:deleted', function () {
        if (drawnItems.getLayers().length === 0) {
            rutaGeoJson = null; // Si no hay capas, limpiar el GeoJSON
        }
    });

    // Mostrar alertas estilizadas
    function showAlert(message, type) {
        const alertContainer = document.getElementById('alertContainer');
        alertContainer.innerHTML = ''; // Limpiar alertas previas
        const alert = document.createElement('div');
        alert.className = `alert alert-${type}`;
        alert.style.padding = '15px';
        alert.style.marginBottom = '10px';
        alert.style.color = type === 'success' ? '#155724' : '#721c24';
        alert.style.backgroundColor = type === 'success' ? '#d4edda' : '#f8d7da';
        alert.style.borderColor = type === 'success' ? '#c3e6cb' : '#f5c6cb';
        alert.style.borderRadius = '5px';
        alert.style.textAlign = 'center';
        alert.style.transition = 'opacity 0.5s ease-in-out';
        alert.innerText = message;
        alert.style.opacity = 0;

        alertContainer.appendChild(alert);

        // Mostrar la alerta con transición
        setTimeout(() => (alert.style.opacity = 1), 50);

        // Ocultar la alerta después de 3 segundos
        setTimeout(() => {
            alert.style.opacity = 0;
            setTimeout(() => alert.remove(), 500); // Retirar del DOM después de la transición
        }, 3000);
    }

    // Guardar la ruta en el servidor
    function guardarRuta() {
        const nombreRuta = document.getElementById('nombreRuta').value.trim();
        if (!nombreRuta) {
            showAlert('Por favor, proporciona un nombre para la ruta.', 'danger');
            return;
        }
        if (!rutaGeoJson) {
            showAlert('Por favor, traza una ruta antes de guardar.', 'danger');
            return;
        }

        fetch('/web/guardar_ruta', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre: nombreRuta, ruta: rutaGeoJson })
        })
        .then(response => {
            if (!response.ok) {
                return response.json().then(data => { throw new Error(data.message || 'Error al guardar la ruta.'); });
            }
            return response.json();
        })
        .then(data => {
            showAlert(data.message, 'success');
            setTimeout(() => {
                window.location.href = "{{ url_for('web_bp.rutas') }}"; // Redirigir a la página principal de rutas
            }, 1500);
        })
        .catch(error => {
            showAlert(error.message, 'danger');
        });
    }
</script>
{% endblock %}
